<style>
  nav {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-around;

    padding: 16px;
    width: 100%;
    height: 100%;
  }

  nav a {
    color: white;
    text-decoration: none;
  }

  nav a.active {
    color: orange;
  }
</style>

  <a [routerLinkActiveOptions]="{exact: true}" routerLink="/"

  <a [routerLinkActiveOptions]="{exact: true}"
     [routerLinkActive]="'active'"
     [routerLink]="['/hero']"
  >Hero</a>
  <a [routerLinkActiveOptions]="{exact: true}"
     routerLink="/dragonball"
     routerLinkActive="active"
  >
    Dragonball
  </a>
  <a [routerLinkActiveOptions]="{exact: true}"
     routerLink="/dragonballsuper"
     routerLinkActive="active"
  >
    Dragonball Super
  </a>
